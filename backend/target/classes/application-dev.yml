spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/crop_advisory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:deja@2410}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: VGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckpXVDEyMzQ1Njc4OTA=
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@cropadvisory.com}
    password: ${ADMIN_PASSWORD:admin123}
    seed: ${SEED_ADMIN:true}
  weather:
    api-url: ${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crop_advisory_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Run tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/crop_advisory_db?useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: test-secret-key-for-ci-only-minimum-256-bits!!
          SEED_ADMIN: 'false'
        run: mvn -B verify
